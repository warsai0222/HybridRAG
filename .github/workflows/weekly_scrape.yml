name: Weekly FDA OPDP Scrape

# Runs every Sunday at 6am UTC.
# Can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  scrape-and-ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache pip so installs are fast on repeat runs
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Cache downloaded PDFs — avoids re-hitting FDA servers on every run.
      # Key includes the week number so the cache refreshes weekly.
      - name: Cache FDA PDF downloads
        uses: actions/cache@v4
        with:
          path: data/pdf_cache
          key: fda-pdf-cache-week-${{ github.run_id }}
          restore-keys: |
            fda-pdf-cache-week-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Compute a 3-year rolling window (e.g. 2024-2026) so the scraper
      # only pulls recent letters — not the entire FDA history every week.
      - name: Compute 3-year rolling window
        id: years
        run: |
          CURRENT_YEAR=$(date +%Y)
          START_YEAR=$((CURRENT_YEAR - 2))
          echo "range=${START_YEAR}-${CURRENT_YEAR}" >> $GITHUB_OUTPUT
          echo "Scraping years: ${START_YEAR} to ${CURRENT_YEAR}"

      # Scrape both untitled and warning letters for the rolling window.
      # --type all writes to data/fda_all_raw.jsonl.
      # Dedup by URL + claim text is built into the scraper, so re-runs are safe.
      - name: Scrape FDA OPDP enforcement letters
        run: |
          python scripts/scrape_fda_opdp.py \
            --type all \
            --years ${{ steps.years.outputs.range }}

      # Validate and ingest new claims into the Neon DB.
      # --skip-llm: borderline docs go to review_queue instead of calling the LLM —
      #   keeps this workflow free (no API spend on a weekly cron).
      # Dedup by content_hash is built into ingest_documents, so already-ingested
      # claims are silently skipped.
      - name: Run ingestion pipeline
        run: |
          python scripts/run_ingestion_pipeline.py \
            --input data/fda_all_raw.jsonl \
            --skip-llm
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      # Print a summary of what's waiting in the review queue after each run.
      - name: Show review queue
        run: |
          python scripts/run_ingestion_pipeline.py --show-review-queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
